#:schema https://dystroy.org/bacon/.bacon.schema.json
#
# bacon config for lava_ui_builder.
#
# Mirrors the aliens-vs-suburbia setup: every job runs on nightly with the same
# fast-compile settings, so they all share one target dir and one sccache namespace:
#
#   * cranelift as the dev-profile codegen backend
#     (CARGO_PROFILE_DEV_CODEGEN_BACKEND + `-Z codegen-backend`; release keeps LLVM)
#   * sccache in front of rustc (RUSTC_WRAPPER)
#   * the parallel rustc frontend (`-Z threads=8`; rustc recommends 8 as the sweet spot)
#   * `--timings` on every job: a report lands in target/cargo-timings/ each run
#   * `-Zhint-mostly-unused` for dependencies only, via the cargo profile key
#     `hint-mostly-unused` (`-Z profile-hint-mostly-unused` + `--config`), which is
#     where it pays off: bevy is huge and we touch a sliver of it. Applying it to
#     our own crate would only make it slower to compile.
#
# Note: the examples pull in bevy with default features (dev-dependencies), so the
# first `--all-targets` or example build is a long one. After that sccache carries it.
#
# Prerequisites:
#   rustup toolchain install nightly
#   rustup component add rustc-codegen-cranelift-preview --toolchain nightly
#   cargo install sccache cargo-nextest
#
# Keys:  c check   y clippy   a clippy-all (default)   f fix   d doc   o doc-open
#        t test    n nextest  e example   r run-example
#
# `check` chains into `clippy` on success (on_success = "job:clippy"): press `c`
# for the fast pass, and if it is clean bacon moves on to the slower lint pass
# by itself. Press `c` again to go back to plain check.
#
# Complete help on configuration: https://dystroy.org/bacon/config/

default_job = "clippy-all"

# Environment shared by every job.
[env]
CARGO_TERM_COLOR = "always"
RUSTC_WRAPPER = "sccache"
CARGO_PROFILE_DEV_CODEGEN_BACKEND = "cranelift"
RUSTFLAGS = "-Z threads=8"

# --- static analysis -----------------------------------------------------------

[jobs.check]
command = [
    "cargo", "+nightly", "check",
    "-Z", "codegen-backend", "-Z", "profile-hint-mostly-unused", "--timings",
    "--config", 'profile.dev.package."*".hint-mostly-unused=true',
    "--all-targets",
]
need_stdout = false
on_success = "job:clippy"

# Library only, default features: the fast lint pass while working in src/.
[jobs.clippy]
command = [
    "cargo", "+nightly", "clippy",
    "-Z", "codegen-backend", "-Z", "profile-hint-mostly-unused", "--timings",
    "--config", 'profile.dev.package."*".hint-mostly-unused=true',
    "--lib",
]
need_stdout = false

# The catch-all: lib, examples and tests, with every feature on so the `feathers`
# paths are linted too. This is the default job.
[jobs.clippy-all]
command = [
    "cargo", "+nightly", "clippy",
    "-Z", "codegen-backend", "-Z", "profile-hint-mostly-unused", "--timings",
    "--config", 'profile.dev.package."*".hint-mostly-unused=true',
    "--all-targets", "--all-features",
]
need_stdout = false

# One-shot: apply every machine-fixable clippy suggestion, then hand over to
# `clippy-all` to show what is left. It moves on whether or not the fix run
# "succeeds" - with deny-level lints still in the tree cargo exits non-zero even
# though the fixes were written. Not a job to sit in: it edits your files, so it
# would fire on its own edits.
[jobs.fix]
command = [
    "cargo", "+nightly", "clippy",
    "-Z", "codegen-backend", "-Z", "profile-hint-mostly-unused", "--timings",
    "--config", 'profile.dev.package."*".hint-mostly-unused=true',
    "--all-targets", "--all-features",
    "--fix", "--allow-dirty", "--allow-staged",
]
need_stdout = false
on_success = "job:clippy-all"
on_failure = "job:clippy-all"

# --- docs ----------------------------------------------------------------------

[jobs.doc]
command = [
    "cargo", "+nightly", "doc",
    "-Z", "codegen-backend", "-Z", "profile-hint-mostly-unused", "--timings",
    "--config", 'profile.dev.package."*".hint-mostly-unused=true',
    "--no-deps",
]
need_stdout = false

# If the doc compiles, it opens in your browser and bacon switches back to the
# previous job so we don't open a new tab on every change.
[jobs.doc-open]
command = [
    "cargo", "+nightly", "doc",
    "-Z", "codegen-backend", "-Z", "profile-hint-mostly-unused", "--timings",
    "--config", 'profile.dev.package."*".hint-mostly-unused=true',
    "--no-deps", "--open",
]
need_stdout = false
on_success = "back" # so that we don't open the browser at each change

# --- tests ---------------------------------------------------------------------

# Plain cargo test, so doc-tests run too (nextest does not run them).
# A specific test:      bacon test -- follower_axis
# Args for the harness: bacon test -- -- --nocapture
[jobs.test]
command = [
    "cargo", "+nightly", "test",
    "-Z", "codegen-backend", "-Z", "profile-hint-mostly-unused", "--timings",
    "--config", 'profile.dev.package."*".hint-mostly-unused=true',
    "--all-features",
]
need_stdout = true

[jobs.nextest]
command = [
    "cargo", "+nightly", "nextest", "run",
    "-Z", "codegen-backend", "-Z", "profile-hint-mostly-unused", "--timings",
    "--config", 'profile.dev.package."*".hint-mostly-unused=true',
    "--all-features",
    "--hide-progress-bar", "--failure-output", "final",
]
need_stdout = true
analyzer = "nextest"

# --- examples ------------------------------------------------------------------
#
# This crate has no integration tests worth the name; CLAUDE.md says validation is
# done by running the examples, so they get first-class jobs.

# Compile-check every example without running any of them. Cheap gate after a
# refactor of the builder or the widget functions.
[jobs.examples]
command = [
    "cargo", "+nightly", "check",
    "-Z", "codegen-backend", "-Z", "profile-hint-mostly-unused", "--timings",
    "--config", 'profile.dev.package."*".hint-mostly-unused=true',
    "--examples", "--all-features",
]
need_stdout = false

# Run one example, picked on the command line:
#   bacon ex -- basic_layout
#   bacon ex -- complex_example
# Saving a file kills the window and rebuilds.
[jobs.ex]
command = [
    "cargo", "+nightly", "run",
    "-Z", "codegen-backend", "-Z", "profile-hint-mostly-unused", "--timings",
    "--config", 'profile.dev.package."*".hint-mostly-unused=true',
    # bacon appends the name you pass after `--`, so this stays last.
    "--example",
]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"

# The one-key example, for when you just want a window on screen. Change the
# name here if you are working on a different one.
[jobs.example]
command = [
    "cargo", "+nightly", "run",
    "-Z", "codegen-backend", "-Z", "profile-hint-mostly-unused", "--timings",
    "--config", 'profile.dev.package."*".hint-mostly-unused=true',
    "--example", "basic_layout",
]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"

[keybindings]
c = "job:check"
y = "job:clippy"
a = "job:clippy-all"
f = "job:fix"
d = "job:doc"
o = "job:doc-open"
t = "job:test"
n = "job:nextest"
e = "job:example"
r = "job:examples"
