[package]
name = "lava_ui_builder"
version = "0.1.0"
edition = "2024"
description = "A fluent UI builder for Bevy"
license = "MIT OR Apache-2.0"

[features]
default = []
feathers = []

# "ui" is expanded by hand (ui_api, ui_bevy_render) instead of used directly:
# it pulls in "default_platform", which hardcodes "android-game-activity" --
# that conflicts with the civilization game's `mobile` crate, which needs
# "android-native-activity" instead (Cargo unions features for a shared
# dependency across the whole build). See civilization/Cargo.toml for the
# matching expansion on the consumer side.
[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["ui", "bevy_feathers"] }

[dev-dependencies]
bevy = { version = "0.19.0", default-features = true }

[lints]
workspace = true

[[example]]
name = "basic_layout"
path = "examples/basic_layout.rs"

[[example]]
name = "buttons"
path = "examples/buttons.rs"

[[example]]
name = "complex_example"
path = "examples/complex_example.rs"

[[example]]
name = "inventory"
path = "examples/inventory.rs"

[[example]]
name = "game_menu"
path = "examples/game_menu.rs"

[[example]]
name = "hud"
path = "examples/hud.rs"

[[example]]
name = "scoreboard"
path = "examples/scoreboard.rs"

[[example]]
name = "dark_light_theme"
path = "examples/dark_light_theme.rs"