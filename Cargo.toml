[package]
name = "lava_ui_builder"
version = "0.1.0"
edition = "2024"
description = "A fluent UI builder for Bevy"
license = "MIT OR Apache-2.0"

[features]
default = []
feathers = []

[dependencies]
bevy = { version = "0.18.0", default-features = false, features = ["ui", "experimental_bevy_feathers"] }
rx_bevy = "0.3.2"

[dev-dependencies]
bevy = { version = "0.18.0", default-features = true }

[lints.clippy]
too_many_arguments = "allow"

[[example]]
name = "basic_layout"
path = "examples/basic_layout.rs"

[[example]]
name = "buttons"
path = "examples/buttons.rs"

[[example]]
name = "complex_example"
path = "examples/complex_example.rs"

[[example]]
name = "inventory"
path = "examples/inventory.rs"

[[example]]
name = "game_menu"
path = "examples/game_menu.rs"

[[example]]
name = "hud"
path = "examples/hud.rs"

[[example]]
name = "scoreboard"
path = "examples/scoreboard.rs"

[[example]]
name = "dark_light_theme"
path = "examples/dark_light_theme.rs"