[package]
name = "lava_ui_builder"
version = "0.1.0"
edition = "2024"
description = "A fluent UI builder for Bevy"
license = "MIT OR Apache-2.0"

[features]
default = []
feathers = []

[dependencies]
bevy = { version = "0.18.0", default-features = false, features = ["ui", "experimental_bevy_feathers"] }

[dev-dependencies]
bevy = { version = "0.18.0", default-features = true }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Bevy idioms that pedantic dislikes.
needless_pass_by_value = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"
doc_markdown = "allow"

# Fluent builder API: every method returns Self by design.
must_use_candidate = "allow"
return_self_not_must_use = "allow"

# Deliberate numeric conversions in layout math.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

too_many_arguments = "allow"
too_many_lines = "allow"

[[example]]
name = "basic_layout"
path = "examples/basic_layout.rs"

[[example]]
name = "buttons"
path = "examples/buttons.rs"

[[example]]
name = "complex_example"
path = "examples/complex_example.rs"

[[example]]
name = "inventory"
path = "examples/inventory.rs"

[[example]]
name = "game_menu"
path = "examples/game_menu.rs"

[[example]]
name = "hud"
path = "examples/hud.rs"

[[example]]
name = "scoreboard"
path = "examples/scoreboard.rs"

[[example]]
name = "dark_light_theme"
path = "examples/dark_light_theme.rs"